<!doctype html><html lang="nl-NL" data-root=""><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inloggen · Quinara (ontwerppreview)</title>
<meta name="robots" content="noindex"><link rel="stylesheet" href="style.css"><script src="app.js"></script></head><body><header class="top"><div class="bar"><span class="logo"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="#fff"/><path d="M15 5 L24 15 L15 25 L6 15Z" fill="#FF5900"/><circle cx="15" cy="15" r="4" fill="#00813D"/></svg>Quinara</span><a href="index.html" style="margin-left:auto;font-size:28px" aria-label="Sluiten">✕</a></div></header><main class="auth" style="max-width:none;padding:20px"><form class="acard" id="f" novalidate><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="#00813D"/><path d="M15 5 L24 15 L15 25 L6 15Z" fill="#FF5900"/><circle cx="15" cy="15" r="4" fill="#00813D"/></svg><h1>Log in bij je Quinara-account</h1>
<div class="fld"><label for="em">E-mailadres*</label><input id="em" type="email" autocomplete="off" required></div>
<div class="fld"><label for="pw">Wachtwoord*</label><input id="pw" type="password" autocomplete="off" required><button type="button" class="eye" aria-label="Wachtwoord tonen">👁</button></div>
<button type="button" class="lnk" id="vg">Inloggegevens vergeten?</button><p class="err" id="er" aria-live="polite"></p>
<button class="btn w">Inloggen</button><p style="font-size:14px">Nog geen account? <a class="lnk" href="registreren.html">Maak een account aan</a></p>
<p style="font-size:12px;color:#737B78">Demo-account: demo@quinara.test / Quinara-Demo-2026. Gegevens blijven in je browser.</p></form></main>
<script>document.querySelector('.eye').onclick=e=>{const p=document.getElementById('pw');p.type=p.type=='password'?'text':'password'};
document.getElementById('vg').onclick=()=>{document.getElementById('er').textContent='Dit is een demo: gebruik demo@quinara.test met wachtwoord Quinara-Demo-2026.'};
document.getElementById('f').onsubmit=e=>{e.preventDefault();if(Q.login(em.value.trim(),pw.value)){location.href=new URLSearchParams(location.search).get('next')||'index.html'}else document.getElementById('er').textContent='Helaas, dat e-mailadres en wachtwoord komen niet overeen. Probeer het opnieuw.'}</script>
<div class="notice" role="note">Ontwerppreview · geen echt kansspel · geen echt geld · 18+</div></body></html>
