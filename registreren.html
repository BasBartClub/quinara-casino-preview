<!doctype html><html lang="nl-NL" data-root=""><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registreren · Quinara (ontwerppreview)</title>
<meta name="robots" content="noindex"><link rel="stylesheet" href="style.css"><script src="app.js"></script></head><body><header class="top"><div class="bar"><span class="logo"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="#fff"/><path d="M15 5 L24 15 L15 25 L6 15Z" fill="#FF5900"/><circle cx="15" cy="15" r="4" fill="#00813D"/></svg>Quinara</span><a href="index.html" style="margin-left:auto;font-size:28px" aria-label="Sluiten">✕</a></div></header><main class="auth" style="max-width:none;padding:20px"><form class="acard" id="f"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="#00813D"/><path d="M15 5 L24 15 L15 25 L6 15Z" fill="#FF5900"/><circle cx="15" cy="15" r="4" fill="#00813D"/></svg><h1>Maak je Quinara-account aan</h1><p class="subtle">Alleen een lokale demo. Gebruik een verzonnen e-mailadres en geen echt wachtwoord.</p>
<div class="fld"><label for="nm">Voornaam*</label><input id="nm" required></div><div class="fld"><label for="em">E-mailadres*</label><input id="em" type="email" required autocomplete="off"></div>
<div class="fld"><label for="pw">Wachtwoord* (min. 8 tekens)</label><input id="pw" type="password" minlength="8" required autocomplete="off"></div>
<label style="font-size:14px"><input type="checkbox" id="ag" required> Ik ben 18 jaar of ouder en begrijp dat dit een demo is.</label><p class="err" id="er" aria-live="polite"></p>
<button class="btn w">Registreren</button><p style="font-size:14px">Al een account? <a class="lnk" href="inloggen.html">Inloggen</a></p></form></main>
<script>document.getElementById('f').onsubmit=e=>{e.preventDefault();const er=document.getElementById('er');if(!nm.value||!em.value.includes('@')||pw.value.length<8||!ag.checked){er.textContent='Vul alle velden correct in en bevestig dat je 18+ bent.';return}
const u=Q.users();if(u[em.value.toLowerCase()]){er.textContent='Dit e-mailadres heeft al een account.';return}u[em.value.toLowerCase()]={pw:pw.value,naam:nm.value};localStorage.setItem('q_users',JSON.stringify(u));Q.login(em.value,pw.value);Q.setCredits(1000);location.href='index.html'}</script>
<div class="notice" role="note">Ontwerppreview · geen echt kansspel · geen echt geld · 18+</div></body></html>
